<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文字管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:720px;margin:32px auto;padding:20px}section{background:white;border:1px solid #e2e5e9;border-radius:16px;padding:24px;margin:16px 0}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{color:#606b78}label{display:block;font-weight:600;margin:18px 0 8px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #cbd1d9;border-radius:8px}textarea{min-height:170px;resize:vertical}button{border:0;border-radius:8px;padding:12px 20px;background:#185bdb;color:#fff;cursor:pointer;min-height:46px}button.secondary{background:#edf1f7;color:#25324a}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}a{color:#185bdb}small{color:#647080}#message{white-space:pre-wrap}#status{white-space:pre-wrap;color:#495565}[hidden]{display:none!important}@media(max-width:520px){main{margin:0;padding:16px}section{padding:18px}button{flex-grow:1}}</style>
<main><h1>文字管理</h1><p>前台白底、左对齐，保留换行，自动适配手机。</p>
<section id="loginBox"><form id="login"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><p><button>登录后台</button></p></form></section>
<div id="editor" hidden><section><h2>开奖检查</h2><div id="status">正在检查…</div><p><small>检查 49208.com 的澳彩（lotteryType=2）。只认可北京时间当天的完整七个号码；跨天自动回到开奖前。未开完或接口异常时，前台持续显示加载动画。</small></p><button class="secondary" id="refresh" type="button">重新检查</button></section>
<form id="settings"><section><label for="afterText">开奖后文字</label><small>当天七个号码全部开出后显示。</small><textarea id="afterText" maxlength="50000" placeholder="输入开奖结束后显示的文字"></textarea><p><nav><button id="save">保存设置</button><a href="/" target="_blank" rel="noopener">打开前台</a><button type="button" class="secondary" id="logout">退出登录</button></nav></p></section></form></div><p id="message" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);let csrf='';
async function api(path,method='GET',body){const r=await fetch(path,{method,cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
async function status(){try{const d=await api('/api/admin/status');$('status').textContent=`${d.state==='complete'?'已开奖':d.state==='pending'?'等待当天开奖':'读取失败，前台加载中'}\n北京时间日期：${d.today}\n开奖日期：${d.drawDate||'—'}　期号：${d.period||'—'}\n最后一个特码：${d.special||'未开出'}\n${d.error||''}`}catch(e){$('message').textContent=e.message}}
async function load(){try{const d=await api('/api/admin/settings');csrf=d.csrf;$('afterText').value=d.afterText;$('loginBox').hidden=true;$('editor').hidden=false;await status()}catch{$('loginBox').hidden=false;$('editor').hidden=true}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',{password:$('password').value});$('password').value='';$('message').textContent='';await load()}catch(e){$('message').textContent=e.message}};
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('/api/admin/settings','POST',{afterText:$('afterText').value});$('message').textContent='已保存，前台将在约 10 秒内更新。'}catch(e){$('message').textContent=e.message}finally{$('save').disabled=false}};
$('refresh').onclick=status;$('logout').onclick=async()=>{await api('/api/logout','POST',{});csrf='';$('afterText').value='';await load()};load();setInterval(()=>{if(!$('editor').hidden)status()},30000);
</script></html>
