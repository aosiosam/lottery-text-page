<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文字管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:12px auto;padding:12px}section{background:white;border:1px solid #e2e5e9;border-radius:10px;padding:12px;margin:10px 0}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:0 0 8px}p{color:#606b78;margin:8px 0}label{display:block;font-weight:600;margin:8px 0 5px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:8px;border:1px solid #cbd1d9;border-radius:8px}textarea{min-height:135px;resize:vertical}button{border:0;border-radius:8px;padding:8px 12px;background:#185bdb;color:#fff;cursor:pointer;min-height:38px}button.secondary{background:#edf1f7;color:#25324a}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}a{color:#185bdb}small{color:#647080}#message{white-space:pre-wrap}#status{white-space:pre-wrap;color:#495565}[hidden]{display:none!important}@media(max-width:520px){main{margin:0;padding:8px}section{padding:10px}button{flex-grow:1}}</style>
<main><h1>文字管理</h1>
<section id="loginBox"><form id="login"><label for="username">账号</label><input id="username" autocomplete="username" value="admin" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><p><button>登录后台</button></p></form></section>
<div id="editor" hidden><form id="settings"><section><h2>前台显示</h2><label for="displayMode">显示方式（二选一）</label><select id="displayMode" style="width:100%;padding:8px;font:inherit"><option value="manual">手动开启</option><option value="scheduled">每天定时开启</option></select><div id="manualRow"><p><button id="publishToday" type="button">显示今日</button> <small id="manualStatus"></small></p><small>点击立即保存当前文字并显示；北京时间次日零点自动恢复加载。</small></div><p id="timeRow" hidden><label for="publishTime">每天开启时间（北京时间）</label><input id="publishTime" type="time" value="22:00"><small>每天到点显示，跨天后重新等待。历史页面保留已保存内容。</small></p><label for="afterText">显示文字</label><small>关闭或未到设定时间时，前台持续加载；不再依赖开奖结果。</small><textarea id="afterText" maxlength="50000" placeholder="输入需要显示的文字"></textarea><p><nav><button id="save">保存设置</button><a href="/poster">生成隐藏二维码图片</a><a href="/preview" target="_blank" rel="noopener">预览已保存文字</a><a href="/" target="_blank" rel="noopener">打开前台</a><button type="button" class="secondary" id="logout">退出登录</button></nav></p></section></form><section><h2>历史记录</h2><p><small>按北京时间每天首次显示时保存一份文字。日期页面保存后固定，之后修改文字不会覆盖历史。从启用当天开始记录。</small></p><nav><button class="secondary" id="historyRefresh" type="button">刷新历史</button><a id="todayLink" target="_blank" rel="noopener">今日页面</a></nav><div id="history" aria-live="polite"></div><p><button class="secondary" id="more" type="button" hidden>加载更多</button></p></section></div><p id="message" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);let csrf='',manualEnabled=false,manualDate=null;const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function manualActive(){return manualEnabled&&manualDate===today()}
function manualButton(){const active=manualActive();$('publishToday').textContent=active?'关闭今日显示':'显示今日';$('manualStatus').textContent=active?'今日已开启，次日零点自动关闭':'今日未开启'}
function displayFields(){$('manualRow').hidden=$('displayMode').value!=='manual';$('timeRow').hidden=$('displayMode').value!=='scheduled';manualButton()}$('displayMode').onchange=displayFields;
async function api(path,method='GET',body){const r=await fetch(path,{method,cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
let nextHistory=null;
async function history(append=false){try{const d=await api('/api/admin/history'+(append&&nextHistory?'?before='+encodeURIComponent(nextHistory):''));if(!append)$('history').replaceChildren();for(const item of d.items){const row=document.createElement('p');const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=item.date+(String(item.period).includes('发布')?' · '+item.period:' · 第 '+item.period+' 期');const details=document.createElement('small');details.textContent='号码：'+(item.numbers||'不依赖开奖');row.append(link,document.createElement('br'),details);$('history').append(row)}if(!d.items.length&&!append)$('history').textContent='暂无历史记录，当天开奖完成后会自动保存。';nextHistory=d.next;$('more').hidden=!nextHistory}catch(e){$('message').textContent=e.message}}
async function load(){try{const d=await api('/api/admin/settings');csrf=d.csrf;$('afterText').value=d.afterText;$('displayMode').value=d.displayMode||'manual';manualEnabled=d.manualEnabled===true;manualDate=d.manualDate;$('publishTime').value=d.publishTime||'22:00';displayFields();$('loginBox').hidden=true;$('editor').hidden=false;await history()}catch{$('loginBox').hidden=false;$('editor').hidden=true}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',{username:$('username').value,password:$('password').value});$('password').value='';$('message').textContent='';await load()}catch(e){$('message').textContent=e.message}};
$('publishToday').onclick=async()=>{const enable=!manualActive();$('publishToday').disabled=true;$('save').disabled=true;try{await api('/api/admin/settings','POST',{afterText:$('afterText').value,displayMode:'manual',manualEnabled:enable,publishToday:enable,publishTime:$('publishTime').value});manualEnabled=enable;manualDate=enable?today():null;manualButton();$('message').textContent=enable?'已保存并开启今日显示，前台约 10 秒内更新；次日零点自动关闭。':'已关闭今日显示，前台约 10 秒内恢复加载。'}catch(e){$('message').textContent=e.message}finally{$('publishToday').disabled=false;$('save').disabled=false}};setInterval(manualButton,30000);
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('/api/admin/settings','POST',{afterText:$('afterText').value,displayMode:$('displayMode').value,manualEnabled:manualActive(),publishTime:$('publishTime').value});$('message').textContent='已保存，正在自动生成今日二维码…';location.assign('/poster?auto=1')}catch(e){$('message').textContent=e.message}finally{$('save').disabled=false}};
$('historyRefresh').onclick=()=>history();$('more').onclick=()=>history(true);$('todayLink').href='/'+new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('logout').onclick=async()=>{await api('/api/logout','POST',{});csrf='';$('afterText').value='';await load()};load();
</script></html>
