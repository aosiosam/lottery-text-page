<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文字管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:12px auto;padding:12px}section{background:white;border:1px solid #e2e5e9;border-radius:10px;padding:12px;margin:10px 0}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:0 0 8px}p{color:#606b78;margin:8px 0}label{display:block;font-weight:600;margin:8px 0 5px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:8px;border:1px solid #cbd1d9;border-radius:8px}textarea{min-height:220px;resize:vertical;overflow-y:hidden}button{border:0;border-radius:8px;padding:8px 12px;background:#185bdb;color:#fff;cursor:pointer;min-height:38px}button.secondary{background:#edf1f7;color:#25324a}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}a{color:#185bdb}small{color:#647080}#message{white-space:pre-wrap}#status{white-space:pre-wrap;color:#495565}[hidden]{display:none!important}@media(max-width:520px){main{margin:0;padding:8px}section{padding:10px}button{flex-grow:1}}.adminHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.adminHeader h1{margin:0}#logout{flex:0 0 auto;min-height:30px;padding:4px 9px;font-size:12px;border-radius:6px}.historyRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.historyRow>a{flex:1;min-width:150px}.historyRow>button{flex:0 0 auto;min-height:30px;padding:4px 10px;font-size:12px}.historyDialog{width:min(600px,94vw);max-height:90vh;border:1px solid #e2e5e9;border-radius:10px;padding:16px}.historyDialog::backdrop{background:#0006}</style>
<main><header class="adminHeader"><h1>文字管理</h1><button type="button" class="secondary" id="logout" hidden>退出登录</button></header>
<section id="loginBox"><form id="login"><label for="username">账号</label><input id="username" autocomplete="username" value="admin" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><p><button>登录后台</button></p></form></section>
<div id="editor" hidden><form id="settings"><section><h2>前台显示</h2><label style="display:flex;align-items:center;gap:8px"><input id="redirectEnabled" type="checkbox" style="width:auto"> 自动跳转</label><label for="pageTitle">前台网页标题</label><input id="pageTitle" type="text" maxlength="200" placeholder="输入浏览器显示的网页标题"><select id="displayMode" aria-label="显示方式" style="width:100%;padding:8px;font:inherit"><option value="manual">手动开启</option><option value="scheduled">每天定时开启</option></select><div id="manualRow"><p><button id="publishToday" type="button">显示今日</button> <small id="manualStatus"></small></p></div><p id="timeRow" hidden><label for="publishTime">每天开启时间（北京时间）</label><input id="publishTime" type="time" value="22:00"><small>每天到点显示，跨天后重新等待。历史页面保留已保存内容。</small></p><textarea id="afterText" aria-label="显示文字" maxlength="50000" placeholder="输入需要显示的文字"></textarea><p><nav><button id="save">保存设置</button><a href="/preview" target="_blank" rel="noopener">预览已保存文字</a><a href="/" target="_blank" rel="noopener">打开前台</a></nav></p></section></form><section><h2>历史记录</h2><nav><button class="secondary" id="historyRefresh" type="button">刷新历史</button><a id="todayLink" hidden></a></nav><div id="history" aria-live="polite"></div><p><button class="secondary" id="more" type="button" hidden>加载更多</button></p></section></div><p id="message" role="status" aria-live="polite"></p><dialog id="historyDialog" class="historyDialog"><form id="historyEditForm"><h2 id="historyEditDate"></h2><label for="historyTitle">网页标题</label><input id="historyTitle" maxlength="200"><label for="historyText">历史文字</label><textarea id="historyText" maxlength="50000"></textarea><nav><button id="historySave" type="submit">保存修改</button><button id="historyCancel" class="secondary" type="button">取消</button></nav><p id="historyEditMessage" role="status"></p></form></dialog><dialog id="historyQrDialog" class="historyDialog" style="max-width:350px;text-align:center"><h2 id="historyQrDate"></h2><p id="historyQrMessage" role="status"></p><img id="historyQrImage" hidden alt="历史页面二维码" style="display:block;width:260px;max-width:100%;height:auto;margin:12px auto;background:#fff"><button id="historyQrClose" type="button" class="secondary">关闭</button></dialog></main>
<script>
const $=id=>document.getElementById(id);let csrf='',manualEnabled=false,manualDate=null;const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function manualActive(){return manualEnabled&&manualDate===today()}
function manualButton(){const active=manualActive();$('publishToday').textContent=active?'关闭今日显示':'显示今日';$('manualStatus').textContent=active?'今日已开启，次日零点自动关闭':'今日未开启'}
function fitText(){const el=$('afterText');el.style.height='auto';el.style.height=Math.max(220,el.scrollHeight+2)+'px'}$('afterText').addEventListener('input',fitText);window.addEventListener('resize',fitText);
function displayFields(){$('manualRow').hidden=$('displayMode').value!=='manual';$('timeRow').hidden=$('displayMode').value!=='scheduled';manualButton()}$('displayMode').onchange=displayFields;
async function api(path,method='GET',body){const r=await fetch(path,{method,cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
let nextHistory=null;
async function history(append=false){try{const d=await api('/api/admin/history'+(append&&nextHistory?'?before='+encodeURIComponent(nextHistory):''));if(!append)$('history').replaceChildren();for(const item of d.items){const row=document.createElement('p');const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=item.date+(String(item.period).includes('发布')?' · '+item.period:' · 第 '+item.period+' 期');const details=document.createElement('small');details.textContent='号码：'+(item.numbers||'不依赖开奖');row.className='historyRow';const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='编辑';edit.onclick=()=>editHistory(item.date);const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='删除';remove.style.color='#b42318';remove.onclick=()=>deleteHistory(item.date,remove);const viewQr=document.createElement('button');viewQr.type='button';viewQr.className='secondary';viewQr.textContent='查看二维码';viewQr.onclick=()=>viewHistoryQr(item.date);row.append(link,viewQr,edit,remove);$('history').append(row)}if(!d.items.length&&!append)$('history').textContent='暂无历史记录。';nextHistory=d.next;$('more').hidden=!nextHistory}catch(e){$('message').textContent=e.message}}
let historyQrObjectUrl=null,historyQrRequest=0;
async function viewHistoryQr(date){const version=++historyQrRequest;if(historyQrObjectUrl){URL.revokeObjectURL(historyQrObjectUrl);historyQrObjectUrl=null}$('historyQrDate').textContent=date+' 二维码';$('historyQrImage').hidden=true;$('historyQrImage').removeAttribute('src');$('historyQrMessage').textContent='正在生成二维码…';$('historyQrDialog').showModal();try{const target='https://svitla.it.com/'+date;const response=await fetch('/api/admin/poster/qrcode?history=1&date='+encodeURIComponent(date)+'&target='+encodeURIComponent(target),{cache:'no-store'});if(!response.ok){let data;try{data=await response.json()}catch{}throw Error(data?.error||'二维码生成失败，请重试')}const blob=await response.blob();if(version!==historyQrRequest||!$('historyQrDialog').open)return;historyQrObjectUrl=URL.createObjectURL(blob);$('historyQrImage').src=historyQrObjectUrl;await $('historyQrImage').decode();if(version!==historyQrRequest||!$('historyQrDialog').open)return;$('historyQrImage').hidden=false;$('historyQrMessage').textContent=''}catch(e){if(version===historyQrRequest&&$('historyQrDialog').open)$('historyQrMessage').textContent=e.message}}
$('historyQrClose').onclick=()=>$('historyQrDialog').close();$('historyQrDialog').addEventListener('close',()=>{historyQrRequest++;if(historyQrObjectUrl){URL.revokeObjectURL(historyQrObjectUrl);historyQrObjectUrl=null}$('historyQrImage').removeAttribute('src')});
let editingDate=null;
async function editHistory(date){try{const d=await api('/api/admin/history/'+date);editingDate=date;$('historyEditDate').textContent='编辑 '+date;$('historyTitle').value=d.title||'';$('historyText').value=d.text||'';$('historyEditMessage').textContent='';$('historyDialog').showModal();const el=$('historyText');el.style.height='auto';el.style.height=Math.max(220,el.scrollHeight+2)+'px'}catch(e){$('message').textContent=e.message}}
async function deleteHistory(date,button){if(!confirm('删除 '+date+' 的历史记录？对应日期页面将无法访问。'))return;button.disabled=true;try{await api('/api/admin/history/'+date,'DELETE');await history();$('message').textContent='已删除 '+date+' 的历史记录'}catch(e){$('message').textContent=e.message}finally{button.disabled=false}}
$('historyCancel').onclick=()=>$('historyDialog').close();
$('historyEditForm').onsubmit=async e=>{e.preventDefault();$('historySave').disabled=true;try{await api('/api/admin/history/'+editingDate,'POST',{title:$('historyTitle').value,text:$('historyText').value});$('historyDialog').close();await history();$('message').textContent='已更新 '+editingDate+' 的历史记录'}catch(e){$('historyEditMessage').textContent=e.message}finally{$('historySave').disabled=false}};
$('historyText').oninput=()=>{const el=$('historyText');el.style.height='auto';el.style.height=Math.max(220,el.scrollHeight+2)+'px'};
async function load(){try{const d=await api('/api/admin/settings');csrf=d.csrf;$('redirectEnabled').checked=d.redirectEnabled!==false;$('pageTitle').value=d.pageTitle||'';$('afterText').value=d.afterText;$('displayMode').value=d.displayMode||'manual';manualEnabled=d.manualEnabled===true;manualDate=d.manualDate;$('publishTime').value=d.publishTime||'22:00';displayFields();$('loginBox').hidden=true;$('editor').hidden=false;$('logout').hidden=false;fitText();await history()}catch{$('loginBox').hidden=false;$('editor').hidden=true;$('logout').hidden=true}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',{username:$('username').value,password:$('password').value});$('password').value='';$('message').textContent='';await load()}catch(e){$('message').textContent=e.message}};
$('publishToday').onclick=async()=>{const enable=!manualActive();$('publishToday').disabled=true;$('save').disabled=true;try{await api('/api/admin/settings','POST',{redirectEnabled:$('redirectEnabled').checked,pageTitle:$('pageTitle').value,afterText:$('afterText').value,displayMode:'manual',manualEnabled:enable,publishToday:enable,publishTime:$('publishTime').value});manualEnabled=enable;manualDate=enable?today():null;manualButton();$('message').textContent=enable?'已保存并开启今日显示，前台约 10 秒内更新；次日零点自动关闭。':'已关闭今日显示，前台约 10 秒内恢复加载。'}catch(e){$('message').textContent=e.message}finally{$('publishToday').disabled=false;$('save').disabled=false}};setInterval(manualButton,30000);
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('/api/admin/settings','POST',{redirectEnabled:$('redirectEnabled').checked,pageTitle:$('pageTitle').value,afterText:$('afterText').value,displayMode:$('displayMode').value,manualEnabled:manualActive(),publishTime:$('publishTime').value});$('message').textContent='已保存，正在自动生成今日二维码…';location.assign('/poster?auto=1')}catch(e){$('message').textContent=e.message}finally{$('save').disabled=false}};
$('historyRefresh').onclick=()=>history();$('more').onclick=()=>history(true);$('todayLink').href='/'+new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('logout').onclick=async()=>{await api('/api/logout','POST',{});csrf='';$('afterText').value='';await load()};load();
</script></html>
