<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文字管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:12px auto;padding:12px}section{background:white;border:1px solid #e2e5e9;border-radius:10px;padding:12px;margin:10px 0}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:0 0 8px}p{color:#606b78;margin:8px 0}label{display:block;font-weight:600;margin:8px 0 5px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:8px;border:1px solid #cbd1d9;border-radius:8px}textarea{min-height:135px;resize:vertical}button{border:0;border-radius:8px;padding:8px 12px;background:#185bdb;color:#fff;cursor:pointer;min-height:38px}button.secondary{background:#edf1f7;color:#25324a}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}a{color:#185bdb}small{color:#647080}#message{white-space:pre-wrap}#status{white-space:pre-wrap;color:#495565}[hidden]{display:none!important}@media(max-width:520px){main{margin:0;padding:8px}section{padding:10px}button{flex-grow:1}}</style>
<main><h1>文字管理</h1>
<section id="loginBox"><form id="login"><label for="password">管理密码</label><input id="password" type="password" autocomplete="current-password" required><p><button>登录后台</button></p></form></section>
<div id="editor" hidden><form id="settings"><section><label for="afterText">开奖后文字</label><small>当天七个号码全部开出后显示。</small><textarea id="afterText" maxlength="50000" placeholder="输入开奖结束后显示的文字"></textarea><p><nav><button id="save">保存设置</button><a href="/poster">生成隐藏二维码图片</a><a href="/preview" target="_blank" rel="noopener">预览已保存文字</a><a href="/" target="_blank" rel="noopener">打开前台</a><button type="button" class="secondary" id="logout">退出登录</button></nav></p></section></form><section><h2>历史记录</h2><p><small>按北京时间每天保存一份开奖后的文字和号码。日期页面保存后固定，之后修改文字不会覆盖历史。从启用当天开始记录。</small></p><nav><button class="secondary" id="historyRefresh" type="button">刷新历史</button><a id="todayLink" target="_blank" rel="noopener">今日页面</a></nav><div id="history" aria-live="polite"></div><p><button class="secondary" id="more" type="button" hidden>加载更多</button></p></section></div><p id="message" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);let csrf='';
async function api(path,method='GET',body){const r=await fetch(path,{method,cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
let nextHistory=null;
async function history(append=false){try{const d=await api('/api/admin/history'+(append&&nextHistory?'?before='+encodeURIComponent(nextHistory):''));if(!append)$('history').replaceChildren();for(const item of d.items){const row=document.createElement('p');const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=item.date+' · 第 '+item.period+' 期';const details=document.createElement('small');details.textContent='号码：'+(item.numbers||'—');row.append(link,document.createElement('br'),details);$('history').append(row)}if(!d.items.length&&!append)$('history').textContent='暂无历史记录，当天开奖完成后会自动保存。';nextHistory=d.next;$('more').hidden=!nextHistory}catch(e){$('message').textContent=e.message}}
async function load(){try{const d=await api('/api/admin/settings');csrf=d.csrf;$('afterText').value=d.afterText;$('loginBox').hidden=true;$('editor').hidden=false;await history()}catch{$('loginBox').hidden=false;$('editor').hidden=true}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',{password:$('password').value});$('password').value='';$('message').textContent='';await load()}catch(e){$('message').textContent=e.message}};
$('settings').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('/api/admin/settings','POST',{afterText:$('afterText').value});$('message').textContent='已保存，前台将在约 10 秒内更新。'}catch(e){$('message').textContent=e.message}finally{$('save').disabled=false}};
$('historyRefresh').onclick=()=>history();$('more').onclick=()=>history(true);$('todayLink').href='/'+new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('logout').onclick=async()=>{await api('/api/logout','POST',{});csrf='';$('afterText').value='';await load()};load();
</script></html>
