<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>html,body{margin:0;min-height:100%;background:#fff;color:#222}body{padding:8px;box-sizing:border-box;font:400 18px/1.25 Arial,"Microsoft YaHei","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}main{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left} [hidden]{display:none!important}.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:40px;background:#fff}.spinner{position:relative;display:block;width:46px;height:46px;border:3px solid #dedede;border-bottom-color:#2d98c1;border-radius:50%;animation:spin 1.1s linear infinite}.spinner::after{content:"";position:absolute;inset:3px;border:2px solid transparent;border-top-color:#3dcb71;border-radius:50%;animation:spin .8s linear infinite reverse}.loadingCaption{display:flex;align-items:baseline;gap:5px;margin-top:25px;color:#555;font-size:14px;font-weight:600;line-height:20px}.loadingDots{display:inline-flex;gap:5px}.loadingDots i{display:block;width:3px;height:3px;border-radius:50%;background:#666;opacity:.25;animation:dotPulse 1.2s linear infinite}.loadingDots i:nth-child(2){animation-delay:.2s}.loadingDots i:nth-child(3){animation-delay:.4s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dotPulse{0%,70%,100%{opacity:.25}35%{opacity:1}}@media(prefers-reduced-motion:reduce){.spinner,.spinner::after,.loadingDots i{animation-duration:3s}}</style>
<div id="loading" class="loading" role="status" aria-label="正在加载" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span class="loadingCaption" aria-hidden="true">数据加载中<span class="loadingDots"><i></i><i></i><i></i></span></span></div>
<main id="text" hidden></main>
<script>
const output=document.getElementById('text');
const loading=document.getElementById('loading');
function render(d){if(d&&typeof d.title==='string'&&document.title!==d.title)document.title=d.title;const done=d?.state==='complete',text=done?(d.text||''):'';if(loading.hidden!==done)loading.hidden=done;if(output.hidden===done)output.hidden=!done;if(output.textContent!==text)output.textContent=text}
const datePath=/^\/\d{4}-\d{2}-\d{2}$/.test(location.pathname)?location.pathname.slice(1):null;
const displayUrl='/api/display'+(datePath?'?date='+encodeURIComponent(datePath):'');
let busy=false;
async function update(){if(busy)return;busy=true;try{const r=await fetch(displayUrl+(displayUrl.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();const d=await r.json();render(d)}catch{/* Keep the last successful display during temporary network errors. */}finally{busy=false}}
update();setInterval(update,1000);window.addEventListener('pageshow',()=>update());document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script>
</html>
