<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机浏览器唤起测试</title><style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:28px 18px;background:#f5f6f8;color:#17202b}main{max-width:520px;margin:30px auto;background:white;border:1px solid #e2e5e9;border-radius:12px;padding:24px}h1{font-size:24px;margin:0 0 12px}p{margin:12px 0}a,button{display:block;width:100%;padding:12px 16px;background:#185bdb;color:white;text-align:center;border:0;border-radius:8px;text-decoration:none;font:inherit}small{color:#647080}[hidden]{display:none!important}</style><main><h1>手机浏览器唤起测试</h1><p id="status">正在检测访问环境…</p><a id="launch" hidden>打开手机浏览器</a><p id="guide" hidden>如果未自动打开，请点击按钮再试。微信也可能阻止调用；请确认是否真的离开微信进入 Safari 或系统浏览器。</p><p><small>测试入口，不会自动打开原网站。</small></p></main><script>(()=>{const ua=navigator.userAgent,target='https://eharmony.me/?from=browser-test',status=document.getElementById('status'),link=document.getElementById('launch'),guide=document.getElementById('guide');if(!/MicroMessenger/i.test(ua)){location.replace(target);return}let scheme='';if(/Android/i.test(ua))scheme='intent://eharmony.me/?from=browser-test#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';else if(/iPhone|iPad|iPod/i.test(ua))scheme='x-safari-https://eharmony.me/?from=browser-test';if(!scheme){status.textContent='请在手机微信中打开本测试。';return}link.href=scheme;link.hidden=false;guide.hidden=false;status.textContent='正在尝试打开手机浏览器…';const timer=setTimeout(()=>status.textContent='如果没有打开，请点击按钮测试。',1500);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer)});try{location.href=scheme}catch{status.textContent='自动调用未完成，请点击按钮测试。'}})();</script></html>
