<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>html,body{margin:0;min-height:100%;background:#fff;color:#222}body{padding:8px;box-sizing:border-box;font:400 18px/1.25 Arial,"Microsoft YaHei","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}main{white-space:pre-wrap;overflow-wrap:anywhere;text-align:left} [hidden]{display:none!important}.loading{position:fixed;inset:0;display:grid;place-items:center}.spinner{width:30px;height:30px;border:3px solid #eee;border-top-color:#777;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}</style>
<div id="loading" class="loading" role="status" aria-label="正在加载" aria-live="polite"><span class="spinner" aria-hidden="true"></span></div>
<main id="text" hidden></main>
<script>
const output=document.getElementById('text');
const loading=document.getElementById('loading');
function render(d){if(d&&typeof d.title==='string'&&document.title!==d.title)document.title=d.title;const done=d?.state==='complete',text=done?(d.text||''):'';if(loading.hidden!==done)loading.hidden=done;if(output.hidden===done)output.hidden=!done;if(output.textContent!==text)output.textContent=text}
const datePath=/^\/\d{4}-\d{2}-\d{2}$/.test(location.pathname)?location.pathname.slice(1):null;
const displayUrl='/api/display'+(datePath?'?date='+encodeURIComponent(datePath):'');
let busy=false;
async function update(){if(busy)return;busy=true;try{const r=await fetch(displayUrl+(displayUrl.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error();const d=await r.json();render(d)}catch{/* Keep the last successful display during temporary network errors. */}finally{busy=false}}
update();setInterval(update,1000);window.addEventListener('pageshow',()=>update());document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script>
</html>
